# Automatyczne wydania gry.
#
# Po wypchnięciu na main (lub domyślną gałąź): jeśli wydania `v<config/version z project.godot>`
# jeszcze nie ma, buduje grę i publikuje wydanie z plikami:
#   DragonGame.exe              – pełna gra dla Windows
#   DragonGame.apk              – pełna gra dla Androida (arm64)
#   game-<silnik>-b<N>.pck          – łatka dla aktualizatora (Windows)
#   game-<silnik>-android-b<N>.pck  – łatka dla aktualizatora (Android)
#   N = config/base_api z project.godot (numer zgodności bazy, patrz docs/RELEASE.md)
# Podpis APK: sekrety ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS.
# Bez nich workflow generuje klucz tymczasowy (nowe APK wtedy nie zainstaluje się „na” stare).
# Czyli: podbij `config/version` w project.godot, wypchnij — gracze dostaną aktualizację.
#
# Ręczne wydanie na GitHubie (Releases -> Publish, tag vX.Y.Z) też jest obsługiwane:
# workflow dobuduje i dołączy pliki (wersja gry = tag).
name: Release build

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"
  # Na razie rozwijamy wersję na telefon; Windows włączymy później ("true").
  BUILD_WINDOWS: "false"

jobs:
  build:
    # wydania z gałęzi main (oraz z gałęzi domyślnej repozytorium)
    if: github.event_name != 'push' || github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Ustal wersję i czy trzeba budować
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            sed -i "s/^config\/version=.*/config\/version=\"${TAG#v}\"/" project.godot
            echo "mode=upload" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
            TAG="v$VERSION"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Wydanie $TAG już istnieje — nic do zrobienia."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
            else
              echo "mode=create" >> "$GITHUB_OUTPUT"
            fi
          fi
          VERSION="${TAG#v}"
          IFS=. read -r MA MI PA <<< "$VERSION"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          sed -i "s/^version\/code=.*/version\/code=$CODE/; s/^version\/name=.*/version\/name=\"$VERSION\"/" export_presets.cfg
          sed -i "s/^application\/file_version=.*/application\/file_version=\"$VERSION.0\"/; s/^application\/product_version=.*/application\/product_version=\"$VERSION.0\"/" export_presets.cfg
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Wersja: $TAG"

      - name: Cache Godot
        if: steps.ver.outputs.mode != 'skip'
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Instalacja Godota i szablonów eksportu
        if: steps.ver.outputs.mode != 'skip'
        run: |
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot && cd ~/godot
            curl -fsSL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q g.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm g.zip
            curl -fsSL -o t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q t.tpz && mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
            mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ && rm -rf templates t.tpz
          fi

      - name: Java 17
        if: steps.ver.outputs.mode != 'skip'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Konfiguracja Androida (SDK, klucz)
        if: steps.ver.outputs.mode != 'skip'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            ALIAS="${KS_ALIAS:-dragon}"; PASS="$KS_PASS"
          else
            echo "::warning::Brak sekretu ANDROID_KEYSTORE_BASE64 — APK podpisany kluczem tymczasowym."
            PASS=$(openssl rand -hex 16); ALIAS=dragon
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Dragon Game, O=Hobby, C=PL"
          fi
          echo "::add-mask::$PASS"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Eksport
        if: steps.ver.outputs.mode != 'skip'
        run: |
          BASE_API=$(sed -n 's/^config\/base_api=\([0-9]*\)/\1/p' project.godot); BASE_API=${BASE_API:-1}
          echo "base_api=$BASE_API"
          ~/godot/godot --headless --path . --import || true
          FILES=()
          if [ "$BUILD_WINDOWS" = "true" ]; then
            mkdir -p build/windows
            ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/DragonGame.exe
            ~/godot/godot --headless --path . --export-pack "Windows Desktop" "build/game-${GODOT_VERSION}-b${BASE_API}.pck"
            FILES+=(build/windows/DragonGame.exe "build/game-${GODOT_VERSION}-b${BASE_API}.pck")
          fi
          mkdir -p build/android
          ~/godot/godot --headless --path . --export-release "Android" build/android/DragonGame.apk
          ~/godot/godot --headless --path . --export-pack "Android" "build/game-${GODOT_VERSION}-android-b${BASE_API}.pck"
          FILES+=(build/android/DragonGame.apk "build/game-${GODOT_VERSION}-android-b${BASE_API}.pck")
          for f in "${FILES[@]}"; do
            test -s "$f" || { echo "Brak pliku $f"; exit 1; }
          done
          printf '%s\n' "${FILES[@]}" > build/files.txt
          ls -la build/*

      - name: Publikacja wydania
        if: steps.ver.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          {
            echo "Automatyczne wydanie z commita ${GITHUB_SHA::7}."
            echo
            echo "**Pobierz:** \`DragonGame.apk\` poniżej (Android)."
            echo "Android: zezwól przeglądarce na instalację aplikacji z nieznanych źródeł."
            echo
            echo "Ostatnie zmiany:"
            git log -n 10 --pretty='- %s'
          } > notes.md
          mapfile -t FILES < build/files.txt
          gh release create "$TAG" "${FILES[@]}" \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md

      - name: Dołączenie plików do istniejącego wydania
        if: steps.ver.outputs.mode == 'upload'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mapfile -t FILES < build/files.txt
          gh release upload "$TAG" "${FILES[@]}" --clobber
